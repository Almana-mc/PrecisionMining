name: Release Build

on:
  workflow_dispatch:
    inputs:
      publish_discord:
        description: "Send Discord notification"
        required: true
        type: boolean
        default: true
      publish_github:
        description: "Publish to GitHub Releases"
        required: true
        type: boolean
        default: true
      publish_curseforge:
        description: "Publish to CurseForge"
        required: true
        type: boolean
        default: true
      publish_modrinth:
        description: "Publish to Modrinth"
        required: true
        type: boolean
        default: true
      confirm:
        description: "Type RELEASE to confirm"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref_name || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      mod_version: ${{ steps.meta.outputs.mod_version }}
      mod_name: ${{ steps.meta.outputs.mod_name }}
      changelog: ${{ steps.meta.outputs.changelog }}
      nodes: ${{ steps.collect.outputs.nodes }}
      minecraft_versions: ${{ steps.collect.outputs.minecraft_versions }}

    steps:
      - name: Confirm release
        shell: bash
        env:
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: |
          if [[ "$INPUT_CONFIRM" != "RELEASE" ]]; then
            echo "Manual confirmation failed. Type RELEASE in the confirm input."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read project metadata
        id: meta
        shell: bash
        run: |
          prop() { sed -nE "s/^$1 *= *\"(.*)\"/\1/p" stonecutter.properties.toml | tr -d '\r'; }
          mod_version="$(prop 'mod\.version')"
          mod_name="$(prop 'mod\.name')"
          changelog_file="CHANGELOGS/${mod_version}.md"

          if [[ ! -f "$changelog_file" ]]; then
            echo "Missing changelog file: $changelog_file"
            exit 1
          fi

          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"
          echo "mod_name=$mod_name" >> "$GITHUB_OUTPUT"
          {
            echo "changelog<<EOF"
            cat "$changelog_file"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build all versions
        run: |
          chmod +x ./gradlew
          ./gradlew build --console=plain

      - name: Collect jars
        id: collect
        shell: bash
        run: |
          mkdir dist
          cp versions/*/build/libs/*.jar dist/
          ls dist
          echo "nodes=$(ls versions | jq -Rnc '[inputs | split("-") | {minecraft: .[0], loader: .[1]}]')" >> "$GITHUB_OUTPUT"
          echo "minecraft_versions=$(ls versions | cut -d- -f1 | sort -uVr | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: release-jars
          path: dist/*.jar

  publish-github:
    name: GitHub Release (${{ matrix.minecraft }})
    needs: build
    if: inputs.publish_github
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        minecraft: ${{ fromJSON(needs.build.outputs.minecraft_versions) }}

    steps:
      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          name: release-jars
          path: dist

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ matrix.minecraft }}-${{ needs.build.outputs.mod_version }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.build.outputs.mod_name }} - ${{ matrix.minecraft }}-${{ needs.build.outputs.mod_version }}
          body: ${{ needs.build.outputs.changelog }}
          files: dist/${{ needs.build.outputs.mod_name }}-*-${{ matrix.minecraft }}-${{ needs.build.outputs.mod_version }}.jar
          fail_on_unmatched_files: true

  publish-curseforge:
    name: CurseForge (${{ matrix.minecraft }} ${{ matrix.loader }})
    needs: build
    if: inputs.publish_curseforge && vars.CURSEFORGE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    env:
      CURSEFORGE_TOKEN: ${{ secrets.TOKEN_CURSEFORGE }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build.outputs.nodes) }}

    steps:
      - name: Validate CurseForge config
        id: curseforge_config
        shell: bash
        run: |
          if [[ -z "$CURSEFORGE_TOKEN" ]]; then
            echo "CurseForge token is not configured. Skipping publish."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download jars
        if: steps.curseforge_config.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-jars
          path: dist

      - name: Publish to CurseForge
        if: steps.curseforge_config.outputs.enabled == 'true'
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          name: ${{ needs.build.outputs.mod_name }} - ${{ matrix.minecraft }}-${{ needs.build.outputs.mod_version }} (${{ matrix.loader }})
          version: ${{ matrix.minecraft }}-${{ needs.build.outputs.mod_version }}-${{ matrix.loader }}
          files: dist/${{ needs.build.outputs.mod_name }}-${{ matrix.loader }}-${{ matrix.minecraft }}-${{ needs.build.outputs.mod_version }}.jar
          changelog: ${{ needs.build.outputs.changelog }}
          loaders: ${{ matrix.loader }}
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}

  publish-modrinth:
    name: Modrinth (${{ matrix.minecraft }} ${{ matrix.loader }})
    needs: build
    if: inputs.publish_modrinth && vars.MODRINTH_PROJECT_ID != ''
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.TOKEN_MODRINTH }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build.outputs.nodes) }}

    steps:
      - name: Validate Modrinth config
        id: modrinth_config
        shell: bash
        run: |
          if [[ -z "$MODRINTH_TOKEN" ]]; then
            echo "Modrinth token is not configured. Skipping publish."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download jars
        if: steps.modrinth_config.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-jars
          path: dist

      - name: Publish to Modrinth
        if: steps.modrinth_config.outputs.enabled == 'true'
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          name: ${{ needs.build.outputs.mod_name }} - ${{ matrix.minecraft }}-${{ needs.build.outputs.mod_version }} (${{ matrix.loader }})
          version: ${{ matrix.minecraft }}-${{ needs.build.outputs.mod_version }}-${{ matrix.loader }}
          files: dist/${{ needs.build.outputs.mod_name }}-${{ matrix.loader }}-${{ matrix.minecraft }}-${{ needs.build.outputs.mod_version }}.jar
          changelog: ${{ needs.build.outputs.changelog }}
          loaders: ${{ matrix.loader }}
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}

  notify-discord:
    name: Notify Discord
    needs: [build, publish-github, publish-curseforge, publish-modrinth]
    if: always() && inputs.publish_discord && needs.build.result == 'success'
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
      DISCORD_ROLE_ID: ${{ vars.DISCORD_RELEASE_ROLE_ID }}
      MOD_NAME: ${{ needs.build.outputs.mod_name }}
      MOD_VERSION: ${{ needs.build.outputs.mod_version }}
      MINECRAFT_VERSIONS: ${{ join(fromJSON(needs.build.outputs.minecraft_versions), ', ') }}
      CHANGELOG: ${{ needs.build.outputs.changelog }}
      GITHUB_RESULT: ${{ needs.publish-github.result }}
      GITHUB_URL: ${{ github.server_url }}/${{ github.repository }}/releases
      CURSEFORGE_RESULT: ${{ needs.publish-curseforge.result }}
      CURSEFORGE_URL: https://www.curseforge.com/projects/${{ vars.CURSEFORGE_PROJECT_ID }}
      MODRINTH_RESULT: ${{ needs.publish-modrinth.result }}
      MODRINTH_URL: https://modrinth.com/mod/${{ vars.MODRINTH_PROJECT_ID }}

    steps:
      - name: Validate Discord config
        id: discord_config
        shell: bash
        run: |
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "Discord webhook is not configured. Skipping notification."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Discord notification
        if: steps.discord_config.outputs.enabled == 'true'
        shell: bash
        run: |
          payload=$(python3 - <<'PY'
          import json
          import os

          def link_line(label, url, result):
              if result == "success":
                  return f"{label}: {url}"
              if result == "skipped":
                  return f"{label}: Skipped"
              if result == "failure":
                  return f"{label}: Failed"
              if result == "cancelled":
                  return f"{label}: Cancelled"
              return f"{label}: {result}"

          role_id = os.environ.get("DISCORD_ROLE_ID", "").strip()
          greeting = f"Hey <@&{role_id}>" if role_id else "Hey"
          release_name = f"{os.environ['MOD_NAME']} {os.environ['MOD_VERSION']} ({os.environ['MINECRAFT_VERSIONS']})"

          static_lines = [
              greeting,
              "",
              f"New release: {release_name}",
              "## Changelog",
              "",
          ]
          footer_lines = [
              "",
              link_line("Curseforge", os.environ["CURSEFORGE_URL"], os.environ.get("CURSEFORGE_RESULT", "").strip()),
              link_line("Modrinth", os.environ["MODRINTH_URL"], os.environ.get("MODRINTH_RESULT", "").strip()),
              link_line("Github", os.environ["GITHUB_URL"], os.environ.get("GITHUB_RESULT", "").strip()),
              "",
              "Thank you all for downloading,",
              "AlmanaX21",
          ]

          changelog = os.environ.get("CHANGELOG", "").strip() or "No changelog provided."
          content = "\n".join(static_lines + [changelog] + footer_lines)
          if len(content) > 1900:
              static_prefix = "\n".join(static_lines)
              static_suffix = "\n".join(footer_lines)
              available = 1900 - len(static_prefix) - len(static_suffix) - len("\n...\n")
              trimmed = changelog[:max(0, available)].rstrip()
              content = "\n".join(static_lines + [trimmed, "..."] + footer_lines)

          payload = {"content": content}
          if role_id:
              payload["allowed_mentions"] = {"parse": [], "roles": [role_id]}

          print(json.dumps(payload))
          PY
          )

          curl \
            --fail \
            --silent \
            --show-error \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_WEBHOOK_URL"
